server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Filenames are not content-hashed. Allow storage, but revalidate on reuse,
    # including service-worker fetches, so deployments do not mix app versions.
    add_header Cache-Control "no-cache" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Keep this in sync with index.html's meta CSP. Both policies are enforced.
    # TLS terminates at the reverse proxy; do not force upgrades on HTTP LAN tests.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'none'; script-src 'self' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://esm.sh 'sha256-DgMFO4QE+qqf2xNgeNb5gMKG6BtiiQFniYj21c88yME=' 'sha256-NnbK2LG1LUwYyZ1xgJN7k3oK4oTvHY4o9852VxwNA/o='; script-src-attr 'none'; worker-src 'self'; connect-src 'self' https://markdownviewer.pages.dev https://api.github.com https://raw.githubusercontent.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://esm.sh https://kroki.io https://www.plantuml.com https://mermaid.ink https://paulrosen.github.io wss://markdownviewer.pages.dev ws://localhost:* ws://127.0.0.1:*; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src-attr 'unsafe-inline'; font-src 'self' data: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; media-src 'self' blob: data: https:; manifest-src 'self'; frame-src 'none'; frame-ancestors 'none'" always;

    # Explicit types cover .mjs even when the base image's MIME map does not.
    location ~* \.m?js$ {
        types { application/javascript js mjs; }
        try_files $uri =404;
    }

    location ~* \.md$ {
        types { text/plain md; }
        try_files $uri =404;
    }

    # Resolve the Compose service at request time so the static image can also
    # run standalone. Only the workspace API and MCP are proxied, not Cloudflare.
    location = /api/workspaces { include /etc/nginx/workspace-proxy.conf; }
    location ^~ /api/workspaces/ { include /etc/nginx/workspace-proxy.conf; }
    location = /mcp { include /etc/nginx/workspace-proxy.conf; }

    # These optional Cloudflare services are not implemented by this container.
    # Never return the application HTML as a successful API/relay response.
    location = /api { return 404; }
    location ^~ /api/ { return 404; }
    location = /live-room { return 404; }
    location ^~ /live-room/ { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
